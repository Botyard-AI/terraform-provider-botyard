name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: normalizer unit tests
        run: python3 scripts/openapi_normalize_test.py
      - name: gofmt
        run: |
          fmtout="$(gofmt -l main.go internal/)"
          if [ -n "$fmtout" ]; then
            echo "These files need gofmt:"; echo "$fmtout"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # terraform-plugin-testing runs a real terraform binary for every
      # resource.UnitTest. With none on PATH it downloads one per test via
      # hc-install (~190 downloads per run), which pushed this job past
      # go test's 10m default. Install one pinned, signature-verified copy up
      # front; plugintest discovers it on PATH. hc-install is already a module
      # dependency (go.mod), so no new third-party action.
      - name: install terraform
        env:
          TERRAFORM_VERSION: 1.15.8
        run: |
          # hc-install extracts into -path but does not create it.
          mkdir -p "$RUNNER_TEMP/terraform"
          go run github.com/hashicorp/hc-install/cmd/hc-install@v0.9.4 \
            install -version "$TERRAFORM_VERSION" -path "$RUNNER_TEMP/terraform" terraform
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/terraform/terraform" version
      - name: unit tests (race detector)
        run: go test ./... -race -count=1

  lint:
    name: lint & vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  docs:
    name: docs drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Regenerate docs/ from the provider schema + examples and fail if the
      # committed docs are stale. Keep the tfplugindocs version in sync with the
      # GNUmakefile (TFPLUGINDOCS_VERSION). --tf-version pins the terraform
      # binary tfplugindocs downloads so example formatting is deterministic.
      - name: regenerate docs
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 \
            generate --provider-name botyard --rendered-provider-name Botyard --tf-version 1.9.8
      # Use `git status --porcelain` (not `git diff --exit-code`) so newly
      # generated but untracked pages — e.g. docs for a resource added without a
      # regenerated page — also count as drift; `git diff` ignores untracked files.
      - name: check docs drift
        run: |
          drift="$(git status --porcelain -- docs/)"
          if [ -n "$drift" ]; then
            echo "::error::docs/ is out of date. Run 'make docs' and commit the result." >&2
            echo "$drift" >&2
            exit 1
          fi

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release workflow extracts the release body with this script and
      # fails before tagging when the section is missing; keep it tested, and
      # prove every released section of CHANGELOG.md still extracts.
      - name: changelog extraction tests
        run: bash scripts/changelog_section_test.sh
      # ADVISORY ONLY: warns (never fails) when a PR changes provider code under
      # internal/ without touching the `## [Unreleased]` section. Not every
      # internal/ change is user-visible (refactors, tests), so a reviewer
      # decides; the warning just makes the omission visible.
      - name: Unreleased entry check (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" 2>fetch.err; then
            echo "::warning title=Changelog check skipped::could not fetch the PR base/head to compare: $(tr '\n' ' ' < fetch.err)"
            exit 0
          fi
          # Captured first (not piped into grep -q) so a SIGPIPE under pipefail
          # cannot read as "no changes".
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- internal/)"
          if [ -z "$changed" ]; then
            echo "No changes under internal/; no Unreleased entry expected."
            exit 0
          fi
          unreleased() {
            git show "$1:CHANGELOG.md" 2>/dev/null \
              | awk '/^## \[Unreleased\]/ { s = 1; next } s && /^## / { exit } s' || true
          }
          if [ "$(unreleased "$BASE_SHA")" = "$(unreleased "$HEAD_SHA")" ]; then
            echo "::warning file=CHANGELOG.md,title=No Unreleased changelog entry::This PR changes internal/ but not the '## [Unreleased]' section of CHANGELOG.md. Add an entry if the change is user-visible."
          else
            echo "CHANGELOG.md '## [Unreleased]' was updated."
          fi
